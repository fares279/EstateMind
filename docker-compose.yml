# Local full stack: Postgres, Redis, API (gunicorn), Celery worker + beat, web.
#   docker compose up --build
# API on http://localhost:8000, web on http://localhost:3000.
# Secrets and API keys come from apps/api/.env (gitignored; see .env.example).
# Model artifacts are mounted from apps/api/artifacts (or fetched via
# ESTATEMIND_ARTIFACTS_URL, see docs/artifacts.md).

x-api: &api
  build: ./apps/api
  image: estatemind-api
  env_file: ./apps/api/.env
  environment: &api-env
    USE_SQLITE: "False"
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME:-estatemind}
    DB_USER: ${DB_USER:-estatemind}
    DB_PASSWORD: ${DB_PASSWORD:-estatemind}
    DB_SSLMODE: disable
    REDIS_URL: redis://redis:6379/0
    ALLOWED_HOSTS: localhost,127.0.0.1,api
    CORS_ALLOWED_ORIGINS: http://localhost:3000
    CSRF_TRUSTED_ORIGINS: http://localhost:3000
    # Scraping outside sites needs explicit approval; never on by accident.
    ENABLE_AUTO_SCRAPER: "False"
  volumes:
    - ./apps/api/artifacts:/app/artifacts
    - hf-cache:/var/cache/huggingface
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-estatemind}
      POSTGRES_USER: ${DB_USER:-estatemind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-estatemind}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    <<: *api
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      start_period: 60s
      retries: 10

  worker:
    <<: *api
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      api:
        condition: service_healthy   # migrations have run

  # Exactly one beat instance, or scheduled tasks run twice.
  beat:
    <<: *api
    environment:
      <<: *api-env
      PRELOAD_LEGAL_EMBEDDING_MODEL: "False"   # beat only schedules; skip loading models
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      API_BASE_URL: http://localhost:8000/api
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  hf-cache:
