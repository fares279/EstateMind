name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: estatemind
          POSTGRES_USER: estatemind
          POSTGRES_PASSWORD: estatemind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U estatemind" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "False"
      USE_SQLITE: ${{ matrix.db == 'sqlite' && 'True' || 'False' }}
      DB_HOST: localhost
      DB_NAME: estatemind
      DB_USER: estatemind
      DB_PASSWORD: estatemind
      PRELOAD_LEGAL_EMBEDDING_MODEL: "False"
      HF_HOME: ~/.cache/huggingface
      # Optional: a bundle made by `scripts/artifacts.py pack`. Without it the
      # artifact-dependent tests skip (7 of 219).
      ESTATEMIND_ARTIFACTS_URL: ${{ secrets.ESTATEMIND_ARTIFACTS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements/*.txt
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-v1
      - run: pip install -r requirements/dev.txt
      - name: Fetch model artifacts
        if: env.ESTATEMIND_ARTIFACTS_URL != ''
        run: python scripts/artifacts.py fetch
      - run: python manage.py check
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest -q -rs

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watchAll=false
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "false"   # CRA treats lint warnings as errors when CI=true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t estatemind-api apps/api
      - run: docker build -t estatemind-web apps/web
